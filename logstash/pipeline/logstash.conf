input {
  # Nhận log từ Filebeat (Network Security Sensor)
  beats {
    port => 5044
  }

  # Giữ lại TCP input cho các nguồn khác
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Thêm metadata
  mutate {
    add_field => { "ingest_node" => "opensearch-ingest" }
  }

  # ===== SURICATA PROCESSING =====
  if [event][module] == "suricata" {
    # Parse Suricata EVE JSON
    if [suricata][eve][event_type] == "alert" {
      mutate {
        add_tag => ["security_alert", "ids_alert"]
      }
    }
  }


  # ===== THREAT INTELLIGENCE ENRICHMENT =====
  # Check source IP against blocklist
  if [source][ip] {
    translate {
      source => "[source][ip]"
      target => "[threat][indicator][matched]"
      dictionary_path => "/usr/share/logstash/threat-intel/blocklist_de.yml"
      fallback => ""
    }
    
    if [threat][indicator][matched] != "" {
      mutate {
        add_tag => ["threat_matched", "malicious_ip"]
        add_field => { "[threat][indicator][type]" => "ip-src" }
        add_field => { "[threat][indicator][provider]" => "blocklist.de" }
      }
    }
  }

  # Check destination IP against blocklist
  if [destination][ip] {
    translate {
      source => "[destination][ip]"
      target => "[threat][indicator][dest_matched]"
      dictionary_path => "/usr/share/logstash/threat-intel/blocklist_de.yml"
      fallback => ""
    }
    
    if [threat][indicator][dest_matched] != "" {
      mutate {
        add_tag => ["threat_matched", "malicious_ip"]
        add_field => { "[threat][indicator][type]" => "ip-dst" }
        add_field => { "[threat][indicator][provider]" => "blocklist.de" }
      }
    }
  }

  # ===== GEOIP ENRICHMENT (WITH MOCK FOR PRIVATE IPs) =====
  
  # MOCK SOURCE GEOIP
  if [source][ip] =~ /^172\.30\.10\./ {
    mutate {
      add_field => { 
        "[source][geo][location]" => "55.7558,37.6173"
        "[source][geo][country_name]" => "Russia"
        "[source][geo][city_name]" => "Moscow"
        "[source][geo][country_iso_code]" => "RU"
      }
    }
  } else if [source][ip] =~ /^172\.30\.20\./ {
    mutate {
      add_field => {
        "[source][geo][location]" => "14.0583,108.2772"
        "[source][geo][country_name]" => "Vietnam"
        "[source][geo][country_iso_code]" => "VN"
      }
    }
  } else if [source][ip] {
    geoip {
      source => "[source][ip]"
      target => "[source][geo]"
    }
  }

  # MOCK DESTINATION GEOIP
  if [destination][ip] =~ /^172\.30\.20\./ {
    mutate {
      add_field => {
        "[destination][geo][location]" => "14.0583,108.2772"
        "[destination][geo][country_name]" => "Vietnam"
        "[destination][geo][country_iso_code]" => "VN"
      }
    }
  } else if [destination][ip] {
    geoip {
      source => "[destination][ip]"
      target => "[destination][geo]"
    }
  }
}

output {
  # 1. LOGS TỪ METRICBEAT (Infrastructure)
  if [agent][type] == "metricbeat" {
    opensearch {
      hosts => ["https://opensearch-ingest:9200"]
      # Ví dụ: siem-metricbeat-system-2026.01.20
      index => "siem-metricbeat-%{[event][module]}-%{+YYYY.MM.dd}"
      user => "admin"
      password => "${LOGSTASH_PASSWORD}"
      ssl => true
      ssl_certificate_verification => false
    }
  } 
  # 2. LOGS TỪ SURICATA (Security)
  else if [event][module] == "suricata" {
    opensearch {
      hosts => ["https://opensearch-ingest:9200"]
      # Ví dụ: siem-suricata-2026.01.20
      index => "siem-suricata-%{+YYYY.MM.dd}"
      user => "admin"
      password => "${LOGSTASH_PASSWORD}"
      ssl => true
      ssl_certificate_verification => false
      timeout => 60
    }
  }
  # 3. LOGS KHÁC (Fallback)
  else {
    opensearch {
      hosts => ["https://opensearch-ingest:9200"]
      index => "siem-general-%{+YYYY.MM.dd}"
      user => "admin"
      password => "${LOGSTASH_PASSWORD}"
      ssl => true
      ssl_certificate_verification => false
    }
  }

  # Debug output
  stdout { codec => rubydebug }
}
