worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    upstream opensearch_cluster {
        # Tự loại node khỏi pool sau 3 lần lỗi trong 30s
        server opensearch-data1:9200 max_fails=3 fail_timeout=30s;
        server opensearch-data2:9200 max_fails=3 fail_timeout=30s;
        server opensearch-data3:9200 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 9200;
        proxy_pass opensearch_cluster;

        # Timeout kết nối tới backend node
        proxy_connect_timeout 30s;

        # Timeout khi không có data (giữ connection sống)
        proxy_timeout 300s;
    }
}