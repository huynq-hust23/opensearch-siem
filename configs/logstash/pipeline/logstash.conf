input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  mutate {
    add_field => { "ingest_node" => "opensearch-cluster" }
  }

  # =============================================================================
  # WINDOWS EVENTS (Sysmon + Security) - ECS NORMALIZATION
  # =============================================================================
  if [winlog] {
    mutate {
      add_tag => ["ecs_normalized"]
      convert => { "[winlog][event_id]" => "integer" }
    }

    # --- process.executable: ưu tiên Image > ProcessName > CallerProcessName > SourceImage
    if ![process][executable] and [winlog][event_data][Image] {
      mutate { copy => { "[winlog][event_data][Image]" => "[process][executable]" } }
    }
    if ![process][executable] and [winlog][event_data][ProcessName] {
      mutate { copy => { "[winlog][event_data][ProcessName]" => "[process][executable]" } }
    }
    if ![process][executable] and [winlog][event_data][CallerProcessName] {
      mutate { copy => { "[winlog][event_data][CallerProcessName]" => "[process][executable]" } }
    }
    if ![process][executable] and [winlog][event_data][SourceImage] {
      mutate { copy => { "[winlog][event_data][SourceImage]" => "[process][executable]" } }
    }

    # --- process.target.executable
    if [winlog][event_data][TargetImage] {
      mutate { copy => { "[winlog][event_data][TargetImage]" => "[process][target][executable]" } }
    }

    # --- process.command_line
    if [winlog][event_data][CommandLine] {
      mutate { copy => { "[winlog][event_data][CommandLine]" => "[process][command_line]" } }
    }

    # --- process.entity_id
    if [winlog][event_data][ProcessGuid] {
      mutate { copy => { "[winlog][event_data][ProcessGuid]" => "[process][entity_id]" } }
    }

    # --- user.name: giữ NGUYÊN full string "DOMAIN\user" để tương thích rule SigmaHQ
    if ![user][name] and [winlog][event_data][User] {
      mutate { copy => { "[winlog][event_data][User]" => "[user][name]" } }
    }
    if ![user][name] and [winlog][event_data][SubjectUserName] {
      mutate { copy => { "[winlog][event_data][SubjectUserName]" => "[user][name]" } }
    }

    # --- Tách DOMAIN\user → user.domain + user.short_name bằng dissect (không cần ruby/regex)
    # dissect tự bỏ qua nếu pattern không match (user.name không có backslash)
    dissect {
      mapping => { "[user][name]" => "%{[user][domain]}\%{[user][short_name]}" }
      tag_on_failure => []
    }

    # --- user.target.name
    if [winlog][event_data][TargetUserName] {
      mutate { copy => { "[winlog][event_data][TargetUserName]" => "[user][target][name]" } }
    }
    dissect {
      mapping => { "[user][target][name]" => "%{[user][target][domain]}\%{[user][target][short_name]}" }
      tag_on_failure => []
    }

    # ---------------------------------------------------------------------------
    # XỬ LÝ THEO TỪNG EVENT ID
    # ---------------------------------------------------------------------------

    # --- NHÁNH 1: EVENT ID 1 (Process Creation)
    if [winlog][event_id] == 1 {
      mutate {
        copy => {
          "[winlog][event_data][ParentImage]"       => "[process][parent][executable]"
          "[winlog][event_data][ParentCommandLine]" => "[process][parent][command_line]"
          "[winlog][event_data][ProcessId]"         => "[process][pid]"
          "[winlog][event_data][ParentProcessId]"   => "[process][parent][pid]"
          "[winlog][event_data][ParentProcessGuid]" => "[process][parent][entity_id]"
          "[winlog][event_data][Hashes]"            => "[process][hash][all]"
          "[winlog][event_data][IntegrityLevel]"    => "[process][integrity_level]"
        }
        convert => {
          "[process][pid]"         => "integer"
          "[process][parent][pid]" => "integer"
        }
      }
    }

    # --- NHÁNH 2: EVENT ID 3 (Network Connection)
    else if [winlog][event_id] == 3 {
      mutate {
        copy => {
          "[winlog][event_data][SourceIp]"        => "[source][ip]"
          "[winlog][event_data][DestinationIp]"   => "[destination][ip]"
          "[winlog][event_data][Protocol]"        => "[network][transport]"
          "[winlog][event_data][SourcePort]"      => "[source][port]"
          "[winlog][event_data][DestinationPort]" => "[destination][port]"
          "[winlog][event_data][ProcessId]"       => "[process][pid]"
        }
        convert => {
          "[source][port]"      => "integer"
          "[destination][port]" => "integer"
          "[process][pid]"      => "integer"
        }
      }
    }

    # --- NHÁNH 3: EVENT ID 11 (File Create)
    else if [winlog][event_id] == 11 {
      mutate {
        copy => {
          "[winlog][event_data][TargetFilename]" => "[file][path]"
          "[winlog][event_data][ProcessId]"      => "[process][pid]"
        }
        convert => { "[process][pid]" => "integer" }
      }
    }

    # --- NHÁNH 4: EVENT ID 12, 13, 14 (Registry)
    else if [winlog][event_id] == 12 or [winlog][event_id] == 13 or [winlog][event_id] == 14 {
      mutate {
        copy => {
          "[winlog][event_data][TargetObject]" => "[registry][key]"
          "[winlog][event_data][ProcessId]"    => "[process][pid]"
        }
        convert => { "[process][pid]" => "integer" }
      }
    }

    # --- NHÁNH 5: EVENT ID 4625 (Logon Failed)
    else if [winlog][event_id] == 4625 {
      if [winlog][event_data][IpAddress] == "-" {
        drop { }
      }
      if [winlog][event_data][IpAddress] {
        mutate { copy => { "[winlog][event_data][IpAddress]" => "[source][ip]" } }
      }
    }

    # --- NHÁNH 6: EVENT ID 1102 hoặc 104 (Audit Log Cleared)
    else if [winlog][event_id] == 1102 or [winlog][event_id] == 104 {
      mutate { add_field => { "[event][action]" => "audit-log-cleared" } }
    }
  }

  # =============================================================================
  # SURICATA PROCESSING
  # =============================================================================
  if [event][module] == "suricata" or [log][file][path] =~ "eve.json" or "suricata" in [tags] {
    if [suricata][eve][event_type] == "alert" {
      mutate { add_tag => ["security_alert", "ids_alert"] }
    }
  }
}

output {
  if [event][module] == "suricata" or [log][file][path] =~ "eve.json" or "suricata" in [tags] {
    opensearch {
      hosts => ["https://nginx-opensearch:9200"]
      index => "siem-suricata-%{+YYYY.MM.dd}"
      user => "admin"
      password => "${LOGSTASH_PASSWORD}"
      ssl => true
      ssl_certificate_verification => false
    }
  }
  else if [agent][type] == "winlogbeat" or [winlog] {
    opensearch {
      hosts => ["https://nginx-opensearch:9200"]
      index => "siem-winlogbeat-%{+YYYY.MM.dd}"
      user => "admin"
      password => "${LOGSTASH_PASSWORD}"
      ssl => true
      ssl_certificate_verification => false
    }
  }
  else {
    opensearch {
      hosts => ["https://nginx-opensearch:9200"]
      index => "siem-general-%{+YYYY.MM.dd}"
      user => "admin"
      password => "${LOGSTASH_PASSWORD}"
      ssl => true
      ssl_certificate_verification => false
    }
  }

  # stdout { codec => rubydebug }
}