input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  mutate {
    add_field => { "ingest_node" => "opensearch-cluster" }
  }

  # =============================================================================
  # WINDOWS EVENTS (Sysmon + Security)
  # =============================================================================
  # SA dùng winlog.event_data.* trực tiếp qua field alias — không copy sang ECS.
  # Chỉ giữ: convert integer tại chỗ + user.name/dissect cho dashboard ngoài SA.
  # =============================================================================
  if [winlog] {
    mutate {
      add_tag => ["ecs_normalized"]
      convert => { "[winlog][event_id]" => "integer" }
    }

    # -------------------------------------------------------------------------
    # user.name + dissect — giữ cho dashboard/correlation ngoài SA
    # Ưu tiên User > SubjectUserName
    # -------------------------------------------------------------------------
    if [winlog][event_data][User] {
      mutate { copy => { "[winlog][event_data][User]" => "[user][name]" } }
    } else if [winlog][event_data][SubjectUserName] {
      mutate { copy => { "[winlog][event_data][SubjectUserName]" => "[user][name]" } }
    }

    # Tách DOMAIN\user → user.domain + user.short_name
    # dissect tự bỏ qua nếu không có backslash
    dissect {
      mapping => { "[user][name]" => "%{[user][domain]}\%{[user][short_name]}" }
      tag_on_failure => []
    }

    # -------------------------------------------------------------------------
    # Convert integer tại chỗ trên winlog.event_data.*
    # SA alias trỏ thẳng vào các fields này — type đúng thì range query mới đúng
    # -------------------------------------------------------------------------

    # --- EVENT ID 1: Process Creation
    if [winlog][event_id] == 1 {
      mutate {
        convert => {
          "[winlog][event_data][ProcessId]"       => "integer"
          "[winlog][event_data][ParentProcessId]" => "integer"
        }
      }
    }

    # --- EVENT ID 3: Network Connection
    else if [winlog][event_id] == 3 {
      mutate {
        convert => {
          "[winlog][event_data][SourcePort]"      => "integer"
          "[winlog][event_data][DestinationPort]" => "integer"
          "[winlog][event_data][ProcessId]"       => "integer"
        }
      }
    }

    # --- EVENT ID 11: File Create
    else if [winlog][event_id] == 11 {
      mutate {
        convert => { "[winlog][event_data][ProcessId]" => "integer" }
      }
    }

    # --- EVENT ID 12, 13, 14: Registry Events
    else if [winlog][event_id] == 12 or [winlog][event_id] == 13 or [winlog][event_id] == 14 {
      mutate {
        convert => { "[winlog][event_data][ProcessId]" => "integer" }
      }
    }

    # --- EVENT ID 4625: Logon Failed
    else if [winlog][event_id] == 4625 {
      # Drop event không có source IP thực (local logon failed)
      if [winlog][event_data][IpAddress] == "-" {
        drop { }
      }
    }

    # --- EVENT ID 1102 / 104: Audit Log Cleared
    else if [winlog][event_id] == 1102 or [winlog][event_id] == 104 {
      mutate { add_field => { "[event][action]" => "audit-log-cleared" } }
    }

  } # end if [winlog]

  # =============================================================================
  # SURICATA PROCESSING
  # =============================================================================
  if [event][module] == "suricata" or [log][file][path] =~ "eve.json" or "suricata" in [tags] {
    if [suricata][eve][event_type] == "alert" {
      mutate { add_tag => ["security_alert", "ids_alert"] }
    }
  }

}

# =============================================================================
# OUTPUT
# =============================================================================
output {
  if [event][module] == "suricata" or [log][file][path] =~ "eve.json" or "suricata" in [tags] {
    opensearch {
      hosts => ["https://nginx-opensearch:9200"]
      index => "siem-suricata-%{+YYYY.MM.dd}"
      user  => "admin"
      password => "${LOGSTASH_PASSWORD}"
      ssl   => true
      ssl_certificate_verification => false
    }
  }
  else if [agent][type] == "winlogbeat" or [winlog] {
    opensearch {
      hosts => ["https://nginx-opensearch:9200"]
      index => "siem-winlogbeat-%{+YYYY.MM.dd}"
      user  => "admin"
      password => "${LOGSTASH_PASSWORD}"
      ssl   => true
      ssl_certificate_verification => false
    }
  }
  else {
    opensearch {
      hosts => ["https://nginx-opensearch:9200"]
      index => "siem-general-%{+YYYY.MM.dd}"
      user  => "admin"
      password => "${LOGSTASH_PASSWORD}"
      ssl   => true
      ssl_certificate_verification => false
    }
  }

  # stdout { codec => rubydebug }
}