# =========================== Metricbeat Configuration ===========================
metricbeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# ================================== General ===================================
tags: ["metricbeat", "prj3"]

# ================================== Outputs ===================================
output.logstash:
  hosts: ["localhost:5044"]

# ================================= Processors =================================
processors:
  - add_host_metadata: ~
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
