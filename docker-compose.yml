services:

  # ========= NGINX  =========
  nginx:
    image: nginx:alpine
    container_name: nginx-opensearch
    ports:
      - "9200:9200"
    volumes:
      - ./configs/nginx/opensearch.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - opensearch-data1
      - opensearch-data2
      - opensearch-data3
    networks:
      - opensearch-net
    restart: unless-stopped

  # ========= DATA 1 =========
  opensearch-data1:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch-data1
    restart: unless-stopped
    environment:
      - cluster.name=siem-cluster
      - node.name=opensearch-data1
      - node.roles=data,cluster_manager
      - discovery.seed_hosts=opensearch-data1,opensearch-data2,opensearch-data3
      - cluster.initial_cluster_manager_nodes=opensearch-data1,opensearch-data2,opensearch-data3
      - network.host=0.0.0.0
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1536m -Xmx1536m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    mem_limit: 3g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
      - ./configs/opensearch/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml
    networks:
      - opensearch-net

  # ========= DATA 2 =========
  opensearch-data2:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch-data2
    restart: unless-stopped
    environment:
      - cluster.name=siem-cluster
      - node.name=opensearch-data2
      - node.roles=data,cluster_manager
      - discovery.seed_hosts=opensearch-data1,opensearch-data2,opensearch-data3
      - cluster.initial_cluster_manager_nodes=opensearch-data1,opensearch-data2,opensearch-data3
      - network.host=0.0.0.0
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1536m -Xmx1536m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    mem_limit: 3g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
      - ./configs/opensearch/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml
    networks:
      - opensearch-net

  # ========= DATA 3 =========
  opensearch-data3:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch-data3
    restart: unless-stopped
    environment:
      - cluster.name=siem-cluster
      - node.name=opensearch-data3
      - node.roles=data,cluster_manager
      - discovery.seed_hosts=opensearch-data1,opensearch-data2,opensearch-data3
      - cluster.initial_cluster_manager_nodes=opensearch-data1,opensearch-data2,opensearch-data3
      - network.host=0.0.0.0
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1536m -Xmx1536m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    mem_limit: 3g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data3:/usr/share/opensearch/data
      - ./configs/opensearch/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml
    networks:
      - opensearch-net

  # ========= DASHBOARD =========
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      # Kết nối cả 3 node — failover tự động khi 1 node chết
      OPENSEARCH_HOSTS: '["https://opensearch-data1:9200","https://opensearch-data2:9200","https://opensearch-data3:9200"]'
    depends_on:
      - opensearch-data1
      - opensearch-data2
      - opensearch-data3
    networks:
      - opensearch-net

  # ========= LOGSTASH =========
  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin@sha256:43b0cdaf26edca812a9eafb684ae6101d8f2fd27165345737c39c04a6c7430eb
    container_name: logstash
    restart: unless-stopped
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
    volumes:
      - ./configs/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./configs/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./sensor/threat-intel:/usr/share/logstash/threat-intel:ro
    depends_on:
      - opensearch-data1
      - opensearch-data2
      - opensearch-data3
    environment:
      - LOGSTASH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    networks:
      - opensearch-net

  # ========= VICTIM (DVWA) =========
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    restart: unless-stopped
    networks:
      server-net:
        ipv4_address: 172.30.20.10
    ports:
      - "8080:80"
    cap_add:
      - NET_ADMIN

  # ========= ROUTER =========
  router:
    image: alpine:latest
    container_name: router
    command: tail -f /dev/null
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      attacker-net:
        ipv4_address: 172.30.10.254
      server-net:
        ipv4_address: 172.30.20.254
    restart: unless-stopped

  # ========= MAILHOG =========
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - opensearch-net

volumes:
  opensearch-data1:
  opensearch-data2:
  opensearch-data3:

networks:
  opensearch-net:
  attacker-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-attacker-net
    ipam:
      config:
        - subnet: 172.30.10.0/24
  server-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-server-net
    ipam:
      config:
        - subnet: 172.30.20.0/24