services:
  # ========= MANAGER =========
  opensearch-manager:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch-manager
    environment:
      - cluster.name=siem-cluster
      - node.name=opensearch-manager
      - node.roles=cluster_manager
      - discovery.seed_hosts=opensearch-manager,opensearch-data1,opensearch-data2
      - cluster.initial_cluster_manager_nodes=opensearch-manager,opensearch-data1,opensearch-data2
      - network.host=0.0.0.0
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - ./opensearch-config/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml
    networks:
      - opensearch-net

  # ========= INGEST =========
  opensearch-ingest:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch-ingest
    environment:
      - cluster.name=siem-cluster
      - node.name=opensearch-ingest
      - node.roles=ingest
      - discovery.seed_hosts=opensearch-manager,opensearch-data1,opensearch-data2
      - network.host=0.0.0.0
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ./opensearch-config/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml
    networks:
      - opensearch-net

  # ========= DATA 1 =========
  opensearch-data1:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch-data1
    environment:
      - cluster.name=siem-cluster
      - node.name=opensearch-data1
      - node.roles=data,cluster_manager
      - discovery.seed_hosts=opensearch-manager,opensearch-data1,opensearch-data2
      - network.host=0.0.0.0
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
      - ./opensearch-config/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    networks:
      - opensearch-net

  # ========= DATA 2 =========
  opensearch-data2:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch-data2
    environment:
      - cluster.name=siem-cluster
      - node.name=opensearch-data2
      - node.roles=data,cluster_manager
      - discovery.seed_hosts=opensearch-manager,opensearch-data1,opensearch-data2
      - network.host=0.0.0.0
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
      - ./opensearch-config/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    networks:
      - opensearch-net

  # ========= DASHBOARD =========
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch-manager:9200"]'
    depends_on:
      - opensearch-manager
    networks:
      - opensearch-net
    # ========= LOGSTASH =========
  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:latest
    container_name: logstash
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - opensearch-ingest
    environment:
      - LOGSTASH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    networks:
      - opensearch-net

volumes:
  opensearch-data1:
  opensearch-data2:


networks:
  opensearch-net:
